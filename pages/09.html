<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09 - Exploration</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../inventory.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #111;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            font-family: monospace;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .leaflet-container {
            background: #111;
        }

        .leaflet-popup-content-wrapper {
            background: #111;
            color: #fff;
            border-radius: 0;
            font-family: monospace;
        }

        .leaflet-popup-tip {
            background: #111;
        }

        .leaflet-control-attribution {
            background: rgba(0, 0, 0, 0.5) !important;
            color: rgba(255, 255, 255, 0.5) !important;
        }

        .leaflet-control-attribution a {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .note-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 5px;
        }

        .note-form textarea {
            background: #222;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px;
            font-family: monospace;
            resize: vertical;
            min-height: 60px;
        }

        .note-form button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            font-family: monospace;
            cursor: pointer;
        }

        .note-form button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            font-size: 0.8rem;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 250px;
        }

        .custom-pin {
            color: #ff3333;
            font-size: 30px;
            text-align: center;
            line-height: 40px;
        }

        .map-style-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .style-button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            font-family: monospace;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
        }

        .style-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .style-button.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .street-view-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
        }

        .street-view-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            display: none;
        }

        #street-view {
            width: 100%;
            height: 100%;
        }

        .street-view-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-family: monospace;
            z-index: 1001;
            font-size: 16px;
        }

        .street-view-close:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .street-view-overlay-text {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            color: white;
            padding: 20px;
            font-family: "Futura-Medium", "Futura", sans-serif;
            font-style: italic;
            font-size: 2.5rem;
            font-weight: 500;
            z-index: 1001;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5),
                         0 0 20px rgba(0, 0, 0, 0.3);
            max-width: 80%;
            line-height: 1.4;
            letter-spacing: 0.5px;
            display: none;
        }

        .street-view-navigation {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            font-family: "Futura-Medium", "Futura", sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .note-image img {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .note-image img:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-button">← back</a>
    <div id="map"></div>
    <div class="instructions">click anywhere on the map to add a pin and note</div>
    
    <div class="map-style-control">
        <button class="style-button active" data-style="dark_matter">Dark Matter</button>
        <button class="style-button" data-style="positron">Positron</button>
        <button class="style-button" data-style="voyager">Voyager</button>
        <button class="style-button" data-style="satellite">Satellite</button>
    </div>

    <div class="street-view-overlay"></div>
    <div class="street-view-container">
        <div id="street-view"></div>
        <button class="street-view-close">×</button>
        <div class="street-view-overlay-text"></div>
        <div class="street-view-navigation"></div>
    </div>

    <div class="lightbox-overlay">
        <div class="lightbox-content">
            <button class="lightbox-close">×</button>
            <img src="" alt="Expanded view">
        </div>
    </div>

    <div class="inventory-panel">
        <div class="inventory-header">
            <span class="inventory-title">Collection</span>
            <button class="inventory-toggle">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div class="inventory-content">
            <!-- Items will be added here dynamically -->
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- REPLACE GOOGLE MAPS API KEY -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initStreetView" async defer></script>
   
    <script src="../inventory.js"></script>
    <script>
        let panorama;
        let streetViewContainer;
        let streetViewOverlay;
        let streetViewClose;
        let currentPinIndex = -1;
        let isTransitioning = false;
        let currentPanorama = null;
        let isJourneying = false;
        let journeyPath = [];
        let currentJourneyStep = 0;

        function initStreetView() {
            console.log('Initializing Street View...');
            try {
                streetViewContainer = document.querySelector('.street-view-container');
                streetViewOverlay = document.querySelector('.street-view-overlay');
                streetViewClose = document.querySelector('.street-view-close');
                
                panorama = new google.maps.StreetViewPanorama(
                    document.getElementById('street-view'),
                    {
                        enableCloseButton: false,
                        addressControl: false,
                        showRoadLabels: false,
                        zoomControl: true,
                        motionTracking: false,
                        motionTrackingControl: false,
                        fullscreenControl: true,
                        panControl: true,
                        streetViewControl: false
                    }
                );

                streetViewClose.addEventListener('click', () => {
                    streetViewContainer.style.display = 'none';
                    streetViewOverlay.style.display = 'none';
                    // Reset journey state when closing
                    isJourneying = false;
                    journeyPath = [];
                    currentJourneyStep = 0;
                    currentPanorama = null;
                });

                streetViewOverlay.addEventListener('click', () => {
                    streetViewContainer.style.display = 'none';
                    streetViewOverlay.style.display = 'none';
                    // Reset journey state when closing
                    isJourneying = false;
                    journeyPath = [];
                    currentJourneyStep = 0;
                    currentPanorama = null;
                });

                console.log('Street View initialized successfully');
            } catch (error) {
                console.error('Error initializing Street View:', error);
            }
        }

        // Initialize map with dark style
        const map = L.map('map', {
            minZoom: 3,
            maxBounds: [[-90, -180], [90, 180]]
        }).setView([39.5, -98.5], 4);
        
        // Define tile layers
        const tileLayers = {
            dark_matter: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                minZoom: 3,
                maxZoom: 19
            }),
            positron: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                minZoom: 3,
                maxZoom: 19
            }),
            voyager: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                minZoom: 3,
                maxZoom: 19
            }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://www.esri.com/">Esri</a>',
                minZoom: 3,
                maxZoom: 19
            })
        };
        
        // Add default tile layer (Dark Matter)
        tileLayers.dark_matter.addTo(map);
        
        // Set up style toggle buttons
        document.querySelectorAll('.style-button').forEach(button => {
            button.addEventListener('click', function() {
                const style = this.getAttribute('data-style');
                
                // Remove all layers
                Object.values(tileLayers).forEach(layer => {
                    if (map.hasLayer(layer)) {
                        map.removeLayer(layer);
                    }
                });
                
                // Add selected layer
                tileLayers[style].addTo(map);
                
                // Update button classes
                document.querySelectorAll('.style-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // Custom icon for pins
        const pinIcon = L.icon({
            iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/e/ed/Map_pin_icon.svg',
            iconSize: [20, 20],
            iconAnchor: [15, 30],
            popupAnchor: [0, -30]
        });

        const predefinedPins = [
            { lat: 40.7128, lng: -74.0060, note: "Here let dead poetry rise", image: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=500" },
            { lat: 23.4162, lng: 25.6628, note: "When you've found your way back to the world" },
            { lat: 35.6762, lng: 139.6503, note: "From this long road you have run", image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500" },
            { lat: -33.8688, lng: 151.2093, note: "Speak my name with living breath" },
            { lat: 19.4326, lng: -99.1332, note: "Wait! Won't you pause, why do you run?", image: "https://images.unsplash.com/photo-1518659522277-7315c0f7d8e8?w=500" },
            // Additional US locations
            { lat: 37.7749, lng: -122.4194, note: "Is there no one here you recognize, not one?" },
            { lat: 47.6062, lng: -122.3321, note: "I must wait here til the heavens wheel past", image: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500" },
            { lat: 41.8781, lng: -87.6298, note: "A mountain, a climb between night and day" },
            { lat: 30.2672, lng: -97.7431, note: "We moved then to the deserted strand" },
            { lat: 34.0522, lng: -118.2437, note: "We labor up through the riven rock", image: "https://images.unsplash.com/photo-1444723121867-7a241cacace9?w=500" },
            { lat: 39.9526, lng: -75.1652, note: "There my sight failed" },
            { lat: 42.3601, lng: -71.0589, note: "Pages turn in the winds from the harbor" }
        ];

        // Add pre-defined pins to map
        predefinedPins.forEach(pin => {
            addMarkerWithPopup(pin.lat, pin.lng, pin.note, pin.image);
        });

        // Function to add a marker with a popup
        function addMarkerWithPopup(lat, lng, note = null, image = null) {
            const marker = L.marker([lat, lng], { icon: pinIcon }).addTo(map);
            
            if (note) {
                // For existing notes
                let popupContent = `<div class="note-content">${note}</div>`;
                if (image) {
                    popupContent += `<div class="note-image"><img src="${image}" alt="Location image" style="max-width: 100%; margin-top: 10px;" onclick="showLightbox(this.src)"></div>`;
                }
                popupContent += `<button type="button" onclick="showStreetView(${lat}, ${lng})" style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 10px; font-family: monospace; cursor: pointer; margin-top: 10px; width: 100%;">Street View</button>`;
                marker.bindPopup(popupContent);
            } else {
                // For new notes
                const popupContent = `
                    <div class="note-form">
                        <textarea placeholder="Add your note here"></textarea>
                        <button type="button" onclick="saveNote(this, ${lat}, ${lng})">Save</button>
                        <button type="button" onclick="showStreetView(${lat}, ${lng})" style="margin-top: 5px;">Street View</button>
                    </div>
                `;
                
                marker.bindPopup(popupContent).openPopup();
            }
            
            return marker;
        }

        // Handle map clicks to add new pins
        map.on('click', function(e) {
            addMarkerWithPopup(e.latlng.lat, e.latlng.lng);
        });

        // Function to save a note
        window.saveNote = function(button, lat, lng) {
            const form = button.parentElement;
            const textarea = form.querySelector('textarea');
            const note = textarea.value.trim();
            
            if (note) {
                const marker = findMarkerByLatLng(lat, lng);
                
                if (marker) {
                    marker.closePopup();
                    marker.unbindPopup();
                    let popupContent = `<div class="note-content">${note}</div>`;
                    popupContent += `<button type="button" onclick="showStreetView(${lat}, ${lng})" style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 10px; font-family: monospace; cursor: pointer; margin-top: 10px; width: 100%;">Street View</button>`;
                    marker.bindPopup(popupContent);
                }
            }
        };

        // Helper function to find a marker by coordinates
        function findMarkerByLatLng(lat, lng) {
            let foundMarker = null;
            
            map.eachLayer(function(layer) {
                if (layer instanceof L.Marker) {
                    const position = layer.getLatLng();
                    if (Math.abs(position.lat - lat) < 0.0001 && Math.abs(position.lng - lng) < 0.0001) {
                        foundMarker = layer;
                    }
                }
            });
            
            return foundMarker;
        }

        // Function to show Street View
        window.showStreetView = function(lat, lng) {
            console.log('Attempting to show Street View at:', lat, lng);
            if (!panorama) {
                console.error('Street View panorama not initialized');
                alert('Street View is not available. Please refresh the page and try again.');
                return;
            }

            // Reset journey state
            isJourneying = false;
            journeyPath = [];
            currentJourneyStep = 0;
            currentPanorama = null;

            try {
                const position = new google.maps.LatLng(lat, lng);
                const service = new google.maps.StreetViewService();
                
                service.getPanoramaByLocation(position, 50, (data, status) => {
                    console.log('Street View status:', status);
                    if (status === google.maps.StreetViewStatus.OK) {
                        streetViewOverlay.style.display = 'block';
                        streetViewContainer.style.display = 'block';
                        currentPanorama = data.location.pano;
                        panorama.setPano(currentPanorama);
                        panorama.setPov({
                            heading: 270,
                            pitch: 0
                        });

                        // Find the current pin index
                        currentPinIndex = predefinedPins.findIndex(pin => 
                            Math.abs(pin.lat - lat) < 0.0001 && Math.abs(pin.lng - lng) < 0.0001
                        );

                        const overlayText = document.querySelector('.street-view-overlay-text');
                        const navigation = document.querySelector('.street-view-navigation');
                        
                        if (currentPinIndex !== -1) {
                            // Show the note for predefined pins
                            overlayText.textContent = predefinedPins[currentPinIndex].note;
                            overlayText.style.display = 'block';

                            // Update navigation button
                            navigation.innerHTML = `
                                <button class="nav-button" onclick="embarkOnJourney()" ${isJourneying ? 'disabled' : ''}>
                                    Embark on Your Journey
                                </button>
                            `;
                            navigation.style.display = 'flex';
                        } else {
                            overlayText.style.display = 'none';
                            navigation.style.display = 'none';
                        }

                        console.log('Street View displayed successfully');
                    } else {
                        console.log('No Street View available at this location');
                        alert('No Street View available at this location');
                    }
                });
            } catch (error) {
                console.error('Error showing Street View:', error);
                alert('Error loading Street View. Please try again.');
            }
        };

        // Function to embark on a journey
        window.embarkOnJourney = function() {
            if (isJourneying || !currentPanorama) return;
            
            isJourneying = true;
            const service = new google.maps.StreetViewService();
            
            // Disable the embark button
            const embarkButton = document.querySelector('.nav-button');
            embarkButton.disabled = true;
            
            // Get the current panorama data
            service.getPanoramaById(currentPanorama, (data, status) => {
                if (status === google.maps.StreetViewStatus.OK) {
                    // Find a path to a nearby interesting location
                    const links = data.links;
                    if (links && links.length > 0) {
                        // Start the journey
                        journeyPath = [];
                        currentJourneyStep = 0;
                        
                        // Build a path of 5-8 steps
                        let currentPano = currentPanorama;
                        let steps = Math.floor(Math.random() * 4) + 5; // 5-8 steps
                        
                        const buildPath = (remainingSteps) => {
                            if (remainingSteps === 0) return;
                            
                            service.getPanoramaById(currentPano, (panoData, panoStatus) => {
                                if (panoStatus === google.maps.StreetViewStatus.OK && panoData.links.length > 0) {
                                    // Choose a random link that's not the one we came from
                                    const availableLinks = panoData.links.filter(link => 
                                        !journeyPath.length || link.pano !== journeyPath[journeyPath.length - 1].from
                                    );
                                    
                                    if (availableLinks.length > 0) {
                                        const nextLink = availableLinks[Math.floor(Math.random() * availableLinks.length)];
                                        journeyPath.push({
                                            from: currentPano,
                                            to: nextLink.pano,
                                            heading: nextLink.heading
                                        });
                                        currentPano = nextLink.pano;
                                        buildPath(remainingSteps - 1);
                                    }
                                }
                            });
                        };
                        
                        buildPath(steps);
                        
                        // Start the journey after a short delay
                        setTimeout(() => {
                            takeNextStep();
                        }, 1000);
                    }
                }
            });
        };

        // Function to take the next step in the journey
        function takeNextStep() {
            if (currentJourneyStep >= journeyPath.length) {
                isJourneying = false;
                const embarkButton = document.querySelector('.nav-button');
                embarkButton.disabled = false;
                return;
            }
            
            const step = journeyPath[currentJourneyStep];
            const service = new google.maps.StreetViewService();
            
            service.getPanoramaById(step.from, (data, status) => {
                if (status === google.maps.StreetViewStatus.OK) {
                    // Set the heading towards the next location
                    panorama.setPov({
                        heading: step.heading,
                        pitch: 0
                    });
                    
                    // Wait a moment before moving to the next position
                    setTimeout(() => {
                        panorama.setPano(step.to);
                        currentPanorama = step.to;
                        currentJourneyStep++;
                        
                        // Take the next step after a delay
                        setTimeout(takeNextStep, 2000);
                    }, 1000);
                }
            });
        }

        // Lightbox functionality
        window.showLightbox = function(imageSrc) {
            const lightbox = document.querySelector('.lightbox-overlay');
            const lightboxImg = lightbox.querySelector('img');
            lightboxImg.src = imageSrc;
            lightbox.style.display = 'flex';
        };

        // Close lightbox when clicking the close button or overlay
        document.querySelector('.lightbox-close').addEventListener('click', () => {
            document.querySelector('.lightbox-overlay').style.display = 'none';
        });

        document.querySelector('.lightbox-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.currentTarget.style.display = 'none';
            }
        });

        // Close lightbox with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelector('.lightbox-overlay').style.display = 'none';
            }
        });

        // Initialize keywords for this page
        const keywords = ['map', 'exploration', 'journey'];
        
        // Make keywords clickable when the page loads
        window.addEventListener('load', () => {
            makeKeywordsClickable(keywords);
        });
    </script>
</body>
